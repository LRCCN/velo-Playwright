# Pipeline de Continuous Deployment
#
# Decisão de arquitetura — por que dois builds em vez de "vercel promote":
# Variáveis VITE_* são embutidas literalmente no bundle JavaScript em tempo
# de build. O comando "vercel promote" apenas re-aponta o alias de domínio
# para um build já existente — ele NÃO reconstrói o projeto. Se promovêssemos
# o build de preview, a aplicação em produção passaria a conversar com o
# Supabase de preview (banco dos testes), violando o isolamento de ambientes.
#
# Fluxo escolhido:
#   1. build-preview  → vercel pull preview  → build → deploy preview
#   2. e2e-tests      → testa contra URL de preview (Supabase de preview)
#   3. build-production → vercel pull production → rebuild → deploy production
#
# Assim cada ambiente carrega as credenciais corretas desde o build.

name: Continuous Deployment

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '24.15'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_SCOPE: luiz-neto

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Run unit tests
        run: yarn test

  build-preview:
    name: Build & Deploy Preview
    needs: [unit-tests]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      # Baixa as variáveis do ambiente Preview da Vercel.
      # VITE_SUPABASE_* neste ambiente apontam para o Supabase de preview.
      - name: Pull Vercel Preview Config
        run: |
          yarn vercel pull --yes \
          --environment=preview \
          --token=$VERCEL_TOKEN \
          --scope=$VERCEL_SCOPE

      # Build embute as variáveis VITE_SUPABASE_* de preview no bundle.
      - name: Build (Preview)
        run: yarn vercel build --token=$VERCEL_TOKEN

      - name: Deploy Preview
        id: deploy
        run: |
          URL=$(yarn --silent vercel deploy --prebuilt \
          --target=preview \
          --token=$VERCEL_TOKEN \
          --scope=$VERCEL_SCOPE | grep -oE 'https://[a-zA-Z0-9._-]+\.vercel\.app' | tail -1)
          echo "deployment-url=$URL" >> $GITHUB_OUTPUT
          echo "Preview URL: $URL"

  e2e-tests:
    name: Run E2E Tests
    needs: [build-preview]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Install Playwright Browser
        run: yarn playwright install --with-deps chromium

      # BASE_URL aponta para o deploy de preview (Supabase de preview).
      # DATABASE_URL_PREVIEW é a connection string do Supabase de preview,
      # usada pelos testes para leitura direta no banco — nunca toca produção.
      - name: Run E2E Regression Tests
        run: yarn playwright test
        env:
          BASE_URL: ${{ needs.build-preview.outputs.deployment-url }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: playwright-report

      - name: Publish Testdino Report
        if: ${{ !cancelled() }}
        run: npx tdpw upload ./playwright-report --token=${{ secrets.TD_TOKEN }}

  build-production:
    name: Build & Deploy Production
    needs: [e2e-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      # Baixa as variáveis do ambiente Production da Vercel.
      # VITE_SUPABASE_* neste ambiente apontam para o Supabase de produção.
      - name: Pull Vercel Production Config
        run: |
          yarn vercel pull --yes \
          --environment=production \
          --token=$VERCEL_TOKEN \
          --scope=$VERCEL_SCOPE

      # Rebuild com variáveis de produção — bundle embute o Supabase de produção.
      - name: Build (Production)
        run: yarn vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy Production
        run: |
          yarn vercel deploy --prebuilt --prod \
          --token=$VERCEL_TOKEN \
          --scope=$VERCEL_SCOPE
