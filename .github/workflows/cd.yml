# Workflow de Integração Contínua focado em execução de testes unitários
# Estrutura preparada para expansão futura (novos jobs, stages, etc.)

name: Continuous Deployment

on:
  push:
    branches:
      - main

env:
  # Versão do Node utilizada em todo o workflow
  NODE_VERSION: '24'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_SCOPE: luiz-neto
  VITE_SUPABASE_PROJECT_ID: kwtzwqhnnybnkpqhughu
  VITE_SUPABASE_URL: https://kwtzwqhnnybnkpqhughu.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_RThrY0JW7uTdBJioguKWhg_HiK9fjj4

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Faz checkout do código do repositório
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # 2. Configura o ambiente Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto
      - name: Install dependencies
        run: yarn install

      # 5. Executa os testes unitários com Vitest
      - name: Run unit tests
        run: yarn test
  
  build-and-deploy:
    name: Build & Deploy Vercel Preview
    needs: [unit-tests]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      # 1. Faz checkout do código do repositório
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # 2. Configura o ambiente Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto
      - name: Install dependencies
        run: yarn install

      # 5. Obter as configurações do vercel
      - name: Pull Vercel Config
        run: |
          yarn vercel pull --yes \
          --environment=preview \
          --token=$VERCEL_TOKEN
      
      # 6. Build para o Vercel
      - name: Build Vercel
        run: yarn vercel build --token=$VERCEL_TOKEN

      # 7. Deploy preview no vercel
      - name: Deploy preview
        id: deploy
        run: |
          URL=$(yarn --silent vercel deploy --prebuilt \
          --target=preview \
          --token=$VERCEL_TOKEN)
          echo "deployment-url=$URL" >> $GITHUB_OUTPUT

  e2e-tests:
    name: Run E2E Tests
    needs: [build-and-deploy]
    runs-on: ubuntu-latest

    steps:
      # 1. Faz checkout do código do repositório
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # 2. Configura o ambiente Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto
      - name: Install dependencies
        run: yarn install

      - name: Debug Playwright install context
        run: |
          #region agent log
          node -e "const fs=require('fs');const cp=require('child_process');const sh=(c)=>cp.execSync(c,{stdio:['ignore','pipe','ignore']}).toString().trim();const data={node:process.version,yarn:sh('yarn --version'),playwright:sh('yarn playwright --version'),home:process.env.HOME,playwrightBrowsersPath:process.env.PLAYWRIGHT_BROWSERS_PATH||'default',pwd:process.cwd()};fs.appendFileSync('debug-41ae37.log',JSON.stringify({sessionId:'41ae37',runId:'ci-playwright-install',hypothesisId:'H2,H3,H5',location:'.github/workflows/cd.yml:debug-context',message:'before playwright install context',data,timestamp:Date.now()})+'\n');"
          #endregion
          cat debug-41ae37.log

      # 5. Instalação do Chromium
      - name: Install Plawright Browser
        run: |
          #region agent log
          node -e "const fs=require('fs');const cp=require('child_process');const sh=(c)=>cp.execSync(c,{stdio:['ignore','pipe','ignore']}).toString().trim();const data={disk:sh('df -h .'),cacheDir:sh('bash -lc \"ls -la ~/.cache 2>/dev/null || true\"')};fs.appendFileSync('debug-41ae37.log',JSON.stringify({sessionId:'41ae37',runId:'ci-playwright-install',hypothesisId:'H1,H2,H3,H4',location:'.github/workflows/cd.yml:install-start',message:'starting playwright chromium install',data,timestamp:Date.now()})+'\n');"
          #endregion
          set +e
          DEBUG=pw:install yarn playwright install --with-deps chromium &
          INSTALL_PID=$!
          export INSTALL_PID
          (
            while kill -0 "$INSTALL_PID" 2>/dev/null; do
              #region agent log
              node -e "const fs=require('fs');const cp=require('child_process');const sh=(c)=>{try{return cp.execSync(c,{stdio:['ignore','pipe','ignore'],shell:'/bin/bash'}).toString().trim()}catch(e){return 'ERR:'+e.status}};const pid=process.env.INSTALL_PID;const data={installPid:pid,installProcess:sh('ps -o pid,ppid,stat,etime,cmd -p '+pid),relatedProcesses:sh('pgrep -af \"playwright|node|unzip|zip|chromium\" || true'),tmpDownloads:sh('du -sh /tmp/playwright-download-* 2>/dev/null || true'),browserCache:sh('du -sh ~/.cache/ms-playwright 2>/dev/null || true'),disk:sh('df -h .')};fs.appendFileSync('debug-41ae37.log',JSON.stringify({sessionId:'41ae37',runId:'ci-playwright-install',hypothesisId:'H1,H3,H4',location:'.github/workflows/cd.yml:install-heartbeat',message:'playwright install still running',data,timestamp:Date.now()})+'\n');"
              #endregion
              cat debug-41ae37.log | tail -n 1
              sleep 30
            done
          ) &
          MONITOR_PID=$!
          wait "$INSTALL_PID"
          INSTALL_STATUS=$?
          export INSTALL_STATUS
          kill "$MONITOR_PID" 2>/dev/null || true
          wait "$MONITOR_PID" 2>/dev/null || true
          set -e
          #region agent log
          node -e "const fs=require('fs');const status=process.env.INSTALL_STATUS;fs.appendFileSync('debug-41ae37.log',JSON.stringify({sessionId:'41ae37',runId:'ci-playwright-install',hypothesisId:'H1,H4',location:'.github/workflows/cd.yml:install-end',message:'playwright chromium install finished',data:{status},timestamp:Date.now()})+'\n');"
          #endregion
          cat debug-41ae37.log
          exit $INSTALL_STATUS

      # 6. Execução dos Testes de Regressão
      - name: Run E2E Regression Tests
        run: yarn playwright test
        env:
          BASE_URL: ${{ needs.build-and-deploy.outputs.deployment-url }}

      # 7. Relatório de Testes Automatizados
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: playwright-report

      - name: Upload CI debug log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ci-debug-log
          path: debug-41ae37.log
      
      # 8. Publicar report JSON do TestDino
      - name: Publish Testdino Report
        if: ${{ !cancelled() }}
        run: npx tdpw upload ./playwright-report --token=${{ secrets.TD_TOKEN }}

  promote:
    name: Promote to Production
    needs: [build-and-deploy, e2e-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Vercel promote
        run: |
          npx vercel@latest promote ${{ needs.build-and-deploy.outputs.deployment-url }} \
          --token=$VERCEL_TOKEN \
          --yes